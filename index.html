const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
let lang = "fr";
function setLang(l){
  lang = l; const d = T[l];
  document.title = d.ttl;  // SEO : titre et description suivent la langue
  $("meta[name=description]").content = d.md; $("meta[property='og:title']").content = d.ttl;
  $("meta[property='og:locale']").content = {fr:"fr_TN", en:"en_US", ar:"ar_TN"}[l];
  document.documentElement.lang = l; document.documentElement.dir = l == "ar" ? "rtl" : "ltr";
  $$("[data-t]").forEach(e => e.textContent = d[e.dataset.t]);
  $$("[data-p]").forEach(e => e.placeholder = d[e.dataset.p]);
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l == l));
  try { localStorage.setItem("lang", l); } catch(e) {}
}
$(".lang").onclick = e => { if (e.target.dataset.l) setLang(e.target.dataset.l); };

/* ===== FOND : PARTICULES QUI RÉAGISSENT À LA SOURIS ===== */
const cv = $("#bg"), cx = cv.getContext("2d"); let W, H, ps = [], m = {x:-999, y:-999};
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight;
  ps = Array.from({length: Math.min(120, Math.floor(W*H/13000))}, (_, i) => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.5, vy:(Math.random()-.5)*.5, r:Math.random()*2+1, c:i%2 ? "214,170,92" : "214,110,140"})); }
addEventListener("resize", resize); resize();
addEventListener("pointermove", e => { m.x = e.clientX; m.y = e.clientY; });
addEventListener("pointerleave", () => { m.x = m.y = -999; });
function frame(){
  cx.clearRect(0, 0, W, H);
  const light = root.dataset.theme == "light", a = light ? .7 : 1;
  for (const p of ps) {
    const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy);
    if (d < 150) { p.x += dx/d * (150-d) * .03; p.y += dy/d * (150-d) * .03; }  // la souris les repousse doucement
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fillStyle = `rgba(${p.c},${.8*a})`; cx.fill();
    if (d < 200) { cx.strokeStyle = `rgba(${p.c},${(1-d/200)*.6*a})`; cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(m.x, m.y); cx.stroke(); }  // fils vers le curseur
  }
  for (let i = 0; i < ps.length; i++) for (let j = i+1; j < ps.length; j++) {
    const d = Math.hypot(ps[i].x-ps[j].x, ps[i].y-ps[j].y);
    if (d < 110) { cx.strokeStyle = `rgba(${ps[i].c},${(1-d/110)*.22*a})`; cx.beginPath(); cx.moveTo(ps[i].x, ps[i].y); cx.lineTo(ps[j].x, ps[j].y); cx.stroke(); }
  }
  requestAnimationFrame(frame);
}
if (!matchMedia("(prefers-reduced-motion:reduce)").matches) frame();
